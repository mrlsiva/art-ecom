<div *ngFor="let product of products">
    <h3>{{ product.name }}</h3>
    <img [src]="product.image" [alt]="product.name" width="150">
    <p>Price: ₹{{ product.price }}</p>
    <a [routerLink]="['/product', product.id]">View Details</a>
    <hr>
</div>

<div *ngIf="products.length === 0">
    <p>No products found!</p>
</div>
